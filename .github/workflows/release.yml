name: Release

# Run by hand from the Actions tab (or `gh workflow run release.yml -f version=v0.1.0-alpha.1`). It builds the
# packages and leaves a DRAFT release: nothing is public and no tag exists until the draft is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to draft a release for, for example v0.1.0-alpha.1 (the numbers must match project(Veneer VERSION ...) in CMakeLists.txt)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || format('dev-{0}', github.run_number) }}

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Linux
            os: ubuntu-latest
            configure: ""
          - name: Windows
            os: windows-latest
            configure: ""

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version matches CMakeLists.txt
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cmake_version=$(sed -n 's/^project(Veneer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag_version=$(echo "$VERSION" | sed -E 's/^v//; s/-.*//')
          if [ "$cmake_version" != "$tag_version" ]; then
            echo "::error::$VERSION does not match project VERSION $cmake_version in CMakeLists.txt"
            exit 1
          fi

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          stage="Veneer-${VERSION}-macOS"
          artefacts=build/Veneer_artefacts/Release
          mkdir "$stage"
          cp -R "$artefacts/VST3/Veneer.vst3" "$artefacts/AU/Veneer.component" "$artefacts/Standalone/Veneer.app" "$stage/"
          cp LICENSE NOTICE.md "$stage/"
          cp packaging/INSTALL-macOS.txt "$stage/INSTALL.txt"

          for binary in Veneer.vst3/Contents/MacOS/Veneer Veneer.component/Contents/MacOS/Veneer Veneer.app/Contents/MacOS/Veneer; do
            archs=$(lipo -archs "$stage/$binary")
            echo "$binary: $archs"
            case "$archs" in *arm64*x86_64* | *x86_64*arm64*) ;; *) echo "::error::$binary is not universal"; exit 1 ;; esac
          done

          for bundle in Veneer.vst3 Veneer.component Veneer.app; do
            codesign --verify --deep --strict "$stage/$bundle"
          done

          ditto -c -k --keepParent "$stage" "$stage.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          stage="Veneer-${VERSION}-Linux"
          artefacts=build/Veneer_artefacts/Release
          mkdir "$stage"
          cp -R "$artefacts/VST3/Veneer.vst3" "$artefacts/Standalone/Veneer" "$stage/"
          cp LICENSE NOTICE.md "$stage/"
          cp packaging/INSTALL-Linux.txt "$stage/INSTALL.txt"
          tar -czf "$stage.tar.gz" "$stage"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "Veneer-$env:VERSION-Windows"
          $artefacts = "build/Veneer_artefacts/Release"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item -Recurse "$artefacts/VST3/Veneer.vst3" $stage
          Copy-Item "$artefacts/Standalone/Veneer.exe" $stage
          Copy-Item LICENSE, NOTICE.md $stage
          Copy-Item packaging/INSTALL-Windows.txt "$stage/INSTALL.txt"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Check the archive (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir verify
          ditto -x -k "Veneer-${VERSION}-macOS.zip" verify
          for bundle in Veneer.vst3 Veneer.component Veneer.app; do
            codesign --verify --deep --strict "verify/Veneer-${VERSION}-macOS/$bundle"
          done
          ls "verify/Veneer-${VERSION}-macOS"

      - name: Check the archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -tzf "Veneer-${VERSION}-Linux.tar.gz"
          tar -tzf "Veneer-${VERSION}-Linux.tar.gz" | grep -q "Veneer.vst3/Contents/x86_64-linux/Veneer.so"

      - name: Check the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "Veneer-$env:VERSION-Windows.zip" -DestinationPath verify
          Get-ChildItem -Recurse verify | Select-Object -ExpandProperty FullName
          if (-not (Test-Path "verify/Veneer-$env:VERSION-Windows/Veneer.vst3/Contents/x86_64-win/Veneer.vst3")) { throw "the VST3 binary is missing" }
          if (-not (Test-Path "verify/Veneer-$env:VERSION-Windows/Veneer.exe")) { throw "the standalone is missing" }

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: |
            Veneer-*-macOS.zip
            Veneer-*-Linux.tar.gz
            Veneer-*-Windows.zip
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft the release
    needs: package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${VERSION}.md"
          args=(--draft --target "$GITHUB_SHA" --title "Veneer ${VERSION#v}")

          case "$VERSION" in
            *-*) args+=(--prerelease) ;;
          esac

          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi

          gh release create "$VERSION" dist/* "${args[@]}"
